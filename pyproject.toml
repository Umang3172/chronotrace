[project]
name = "chronotrace"
version = "0.1.0"
description = "Repairs concurrency-induced flaky asyncio tests by trace-differential diagnosis, deterministic patching and forced-interleaving replay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ChronoTrace contributors" }]
keywords = ["flaky-tests", "asyncio", "concurrency", "opentelemetry", "test-repair"]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "libcst>=1.4",
    "networkx>=3.3",
    "structlog>=24.1",
    "typer>=0.12",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-json-report>=1.5",
    "pytest-repeat>=0.9",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34", "strands-agents>=0.1"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "types-networkx>=3.3",
]

[project.scripts]
chronotrace = "chronotrace.cli:main"

[project.entry-points.pytest11]
chronotrace = "chronotrace.capture.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronotrace"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmark/cases", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ARG"]
"chronotrace/verify/regression.py" = ["E501"]
# LibCST dictates visitor method names and signatures.
"chronotrace/synthesize/apply.py" = ["N802", "ARG002", "D102"]
"chronotrace/govern/*.py" = ["N802", "ARG002", "D102"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "."
exclude = ["benchmark/cases", "ui", "demo", "chronotrace/agent/deploy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "libcst.*", "boto3.*", "botocore.*", "strands.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["benchmark: end-to-end runs over the seeded benchmark corpus"]

[tool.coverage.run]
# Measure with `coverage run -m pytest`, not `pytest --cov`. ChronoTrace ships a
# pytest plugin through the pytest11 entry point, so pytest imports the package
# while loading plugins — before pytest-cov starts measuring — and every module
# body would be recorded as unexecuted.
source = ["chronotrace"]
omit = ["chronotrace/agent/*", "chronotrace/providers/bedrock.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]
